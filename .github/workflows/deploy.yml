name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: www.k8s.it

      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          KEY: 2f1e3829a71a476599c52f6301324135
        run: |
          # posts added or modified in this push; drafts are not built, so they are skipped
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE=HEAD~1; fi
          urls=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'content/posts/*.md' \
            | while read -r f; do
                slug=$(basename "$f" .md)
                [ -f "public/posts/$slug/index.html" ] && echo "https://www.k8s.it/posts/$slug/"
              done)
          if [ -z "$urls" ]; then echo "no published post changed, nothing to submit"; exit 0; fi
          urls="https://www.k8s.it/"$'\n'"$urls"
          echo "$urls"
          # give GitHub Pages time to publish before the crawler comes
          sleep 90
          body=$(echo "$urls" | jq -R . | jq -s --arg key "$KEY" \
            '{host:"www.k8s.it", key:$key, keyLocation:("https://www.k8s.it/"+$key+".txt"), urlList:.}')
          curl -s -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body"
